name: Daily Vocabulary Ingestion

on:
  schedule:
    - cron: '0 8 * * *'  # runs every day at 08:00 UTC
  workflow_dispatch:      # allows manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run vocabulary ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/vocab_ingest.py

      - name: Commit and push changes
        run: |
          git config user.name "vocab-bot"
          git config user.email "vocab-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "vocab: daily ingestion $(date +'%Y-%m-%d')"
          git push
